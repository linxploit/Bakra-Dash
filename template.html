<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Secure Connection</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Goat background effect */
        body::before {
            content: "🐐";
            position: fixed;
            font-size: 300px;
            opacity: 0.03;
            bottom: -50px;
            right: -50px;
            pointer-events: none;
            transform: rotate(-15deg);
        }
        
        body::after {
            content: "🐐";
            position: fixed;
            font-size: 200px;
            opacity: 0.03;
            top: -50px;
            left: -50px;
            pointer-events: none;
            transform: rotate(10deg);
        }
        
        .container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 500px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            backdrop-filter: blur(10px);
            z-index: 1;
            animation: fadeInUp 0.6s ease-out;
        }
        
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .goat-icon {
            font-size: 80px;
            margin-bottom: 20px;
            animation: bounce 2s ease infinite;
            display: inline-block;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(5deg); }
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .loader {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-left-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .status {
            color: #667eea;
            font-weight: 600;
            margin: 20px 0;
            font-size: 14px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            width: 0%;
            border-radius: 10px;
            transition: width 0.3s ease;
        }
        
        .steps {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .step {
            flex: 1;
            font-size: 12px;
            color: #999;
        }
        
        .step.active {
            color: #667eea;
            font-weight: 600;
        }
        
        .secure-badge {
            margin-top: 25px;
            font-size: 12px;
            color: #aaa;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .secure-badge span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        
        .redirect-note {
            margin-top: 20px;
            font-size: 11px;
            color: #ccc;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="goat-icon">🐐</div>
        <h1>BakraDash Secure Gateway</h1>
        <div class="subtitle">Establishing secure encrypted channel...</div>
        
        <div class="loader"></div>
        <div class="status">🔒 SSL Handshake in progress</div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
        
        <div class="steps">
            <div class="step" id="step1">🔄 DNS Resolution</div>
            <div class="step" id="step2">🔐 TLS Negotiation</div>
            <div class="step" id="step3">✓ Verification</div>
        </div>
        
        <div class="secure-badge">
            <span>🔒 256-bit SSL</span>
            <span>🛡️ Cloudflare Secured</span>
            <span>✓ GDPR Compliant</span>
        </div>
        <div class="redirect-note">Redirecting to secure portal...</div>
    </div>

    <script>
        let progress = 0;
        const progressFill = document.getElementById('progressFill');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');
        const step3 = document.getElementById('step3');
        const statusText = document.querySelector('.status');
        
        const statusMessages = [
            "🔒 SSL Handshake in progress",
            "🌐 Resolving secure DNS",
            "🔐 Establishing TLS 1.3 tunnel",
            "✓ Validating security certificate",
            "🔄 Authenticating session",
            "🐐 Redirecting to dashboard"
        ];
        
        let msgIndex = 0;
        
        const interval = setInterval(() => {
            progress += 8;
            if (progress >= 100) {
                progress = 100;
                clearInterval(interval);
                statusText.innerHTML = "✓ Connection established! Redirecting...";
                step1.classList.add('active');
                step2.classList.add('active');
                step3.classList.add('active');
                
                setTimeout(() => {
                    const templates = [
                        'festival.html',
                        'meeting.html', 
                        'livestream.html',
                        'verification.html',
                        'dating.html',
                        'support.html',
                        'jobinterview.html',
                        'doctorvisit.html'
                    ];
                    const randomTemplate = templates[Math.floor(Math.random() * templates.length)];
                    window.location.href = randomTemplate;
                }, 1000);
            }
            
            progressFill.style.width = progress + '%';
            
            if (progress > 30 && !step1.classList.contains('active')) {
                step1.classList.add('active');
                statusText.innerHTML = statusMessages[1];
            }
            if (progress > 60 && !step2.classList.contains('active')) {
                step2.classList.add('active');
                statusText.innerHTML = statusMessages[2];
            }
            if (progress > 85 && !step3.classList.contains('active')) {
                step3.classList.add('active');
                statusText.innerHTML = statusMessages[4];
            }
        }, 200);
        
        // Random goat fact in console (for fun)
        const goatFacts = [
            "🐐 Goats have rectangular pupils",
            "🐐 BakraDash v1.0 by Linxploit x Mindless", 
            "🐐 Goats were one of the first animals to be domesticated",
            "🐐 A group of goats is called a tribe or herd"
        ];
        console.log(goatFacts[Math.floor(Math.random() * goatFacts.length)]);
    </script>
</body>
</html>
